<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Scanner</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <script src="https://unpkg.com/html5-qrcode"></script>
   </head>
   <body>
      <nav class="navbar bg-primary-subtle">
         <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Multiline Scanner</span>
         </div>
      </nav>
      <div class="container my-3">
         <div class="mx-auto" style="width: 250px" id="reader"></div>
         <div class="mb-3">
            <label for="FormControlTextarea" class="form-label my-2 fw-bold">Result:</label>
            <textarea class="form-control" id="FormControlTextarea" rows="3"></textarea>
         </div>
         <div class="mt-2 text-center">
            <button class="btn btn-primary" onclick="copyText()">Copy All</button>
            <button class="btn btn-danger" onclick="removeLastLine()">Delete Last Line</button>
         </div>
      </div>
   </body>
   <script>
      function removeLastLine() {
          const textarea = document.getElementById("FormControlTextarea");
      
          let lines = textarea.value.split("\n");
      
          if (lines.length > 0) {
            lines.pop();
          }
      
          textarea.value = lines.join("\n");
        }
      
          function copyText() {
          const textarea = document.getElementById("FormControlTextarea");
      
          textarea.select();
          textarea.setSelectionRange(0, 99999);
      
          document.execCommand("copy");
      
          alert("Copied!");
        }
        
            function onScanSuccess(decodedText, decodedResult) {
               const textarea = document.getElementById("FormControlTextarea");
          textarea.value += decodedText + "\n";
            }
            
            var html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 150 });
            html5QrcodeScanner.render(onScanSuccess);
         
   </script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
   </body>
</html>
